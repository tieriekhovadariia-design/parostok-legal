<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Паросток</title>
<meta property="og:title" content="Паросток">
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/ua/app/id6790760070">
<style>
  :root{
    --paper:#FBFAF6;
    --ink:#1F2A24;
    --green:#3E6B4E;
    --sage:#6B7A70;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    text-align:center;
    padding:24px;
  }
  p{margin:0 0 12px;line-height:1.5;}
  .sub{color:var(--sage);}
  a{color:var(--green);font-weight:600;}
</style>
</head>
<body>
<main>
  <p>паросток відкривається в app store</p>
  <p class="sub">якщо нічого не сталось, натисни посилання нижче</p>
  <p><a href="https://apps.apple.com/ua/app/id6790760070">відкрити паросток в app store</a></p>
</main>
<script>
  window.location.replace('https://apps.apple.com/ua/app/id6790760070');
</script>
</body>
</html>
